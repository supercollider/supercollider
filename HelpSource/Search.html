<!doctype html>
<html lang="en">

<head>
    <title>Search | SuperCollider Help</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv='Content-Type' content='text/html; charset=UTF-8' />
    <link rel='stylesheet' href='./static/scdoc.css' type='text/css' />
    <link rel='stylesheet' href='./static/frontend.css' type='text/css' />
    <link rel='stylesheet' id='scdoc-theme' href='./static/themes/default.css' type='text/css' />
    <link rel='stylesheet' href='./custom.css' type='text/css' />
    <script src="./static/lib/jquery.min.js"></script>
    <script>
        var scdoc_title = "Search";
        var scdoc_sc_version = "";
    </script>
    <script src="./static/scdoc.js" type="text/javascript"></script>
    <script src="./docmap.js" type="text/javascript"></script>
    <script src="./static/lib/elasticlunr-0.9.5.min.js" type="text/javascript"></script>
    <script src="./static/search.js" type="text/javascript"></script>
    <script src="./static/fulltextsearch.js" type="text/javascript"></script>
    <script src="./static/searchpage.js" type="text/javascript"></script>
    <script src="frontend.js"></script>
</head>

<body onload="spOnLoad()">
    <noscript>
        <p>The search page needs JavaScript.</p>
    </noscript>

    <div id="menubar"></div>
    <div class='contents'>
        <div class='header'>
            <h1>Search</h1>
            <div id='summary'>Search all documents</div>
        </div>

        <div id="search_box">
            Search text:
            <input type="text" id="search_input" value="" size="40" />
        </div>

        <div id="search_tabs" role="tablist">
            <button type="button" role="tab" data-view="text">Full text <span class="search_tab_count" id="text_tab_count"></span></button>
            <button type="button" role="tab" data-view="lookup">Lookup <span class="search_tab_count" id="lookup_tab_count"></span></button>
        </div>

        <div id="search_checks0">
            Filter:
            <select id="menu_filter">
                <option SELECTED value="all">All documents</option>
                <option value="classes">Classes only</option>
                <option value="reference">Reference only</option>
                <option value="guides">Guides only</option>
                <option value="tutorials">Tutorials only</option>
                <option value="overviews">Overviews only</option>
                <option value="other">Other only</option>
            </select>
            <label><input type="checkbox" id="check_extensions" checked> Include extensions</label>
            <label class="search_view_text"><input type="checkbox" id="check_code"> Include code examples</label>
        </div>

        <table id="search_settings" class="search_view_lookup">
            <td>Options:
                <td>
                    <div id="search_checks">
                        <input type="checkbox" id="ignore_case" checked="true">Ignore case</input>
                        <input class="nonregex" type="checkbox" id="check_word">Whole word</input>
                        <input class="nonregex" type="checkbox" id="check_prefix">Starts with</input>
                        <input class="nonregex" type="checkbox" id="check_suffix">Ends with</input>
                        <input type="checkbox" id="check_regexp">Regexp</input>
                    </div>
                    <tr>
                        <td>Match:
                            <td>
                                <div id="search_checks">
                                    <input type="checkbox" id="check_title" checked="true">Title/Filename</input>
                                    <input type="checkbox" id="check_summary" checked="true">Summary</input>
                                    <input type="checkbox" id="check_categories">Categories</input>
                                    <input type="checkbox" id="check_methods" checked="true">Methods</input>
                                </div>
        </table>
        <div id="random" class="search_view_lookup">
            <a href="javascript:randomDoc()">random page</a>
        </div>

        <div class="search_view_text">
            <div id="search_status">Loading documents&hellip;</div>
            <div id="text_count" class="search_count"></div>
            <div id="text_results"></div>
        </div>
        <div class="search_view_lookup">
            <div id="lookup_count" class="search_count"></div>
            <div id="lookup_results"></div>
        </div>
        <div id="js_error"></div>
    </div>
</body>

</html>
