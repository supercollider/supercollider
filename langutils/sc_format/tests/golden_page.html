<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sc_format golden tests</title>
<!-- The page that test.py --html writes. It fills in the comments in capitals. -->
<style>
:root {
    /* A contents list on the left, the tests one under another on the right, each input beside its expected output. */
    --bg: #f3f4f7;
    --surface: #ffffff;
    --ink: #1a202d;
    --muted: #5d6677;
    --rule: #d9dde5;
    --accent: #2d50bf;
    --whitespace: #a9b1bf;
    --old: #fcebe8;
    --old-mark: #f3bfb8;
    --new: #e5f4e9;
    --new-mark: #abdcb9;
    --pad: #e4e7ed;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-code: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #121419;
        --surface: #1a1e25;
        --ink: #dde2eb;
        --muted: #8e97a8;
        --rule: #2c323d;
        --accent: #8ea7ff;
        --whitespace: #4e5767;
        --old: #35201f;
        --old-mark: #6a2f2b;
        --new: #16301f;
        --new-mark: #255a38;
        --pad: #252a33;
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121419;
    --surface: #1a1e25;
    --ink: #dde2eb;
    --muted: #8e97a8;
    --rule: #2c323d;
    --accent: #8ea7ff;
    --whitespace: #4e5767;
    --old: #35201f;
    --old-mark: #6a2f2b;
    --new: #16301f;
    --new-mark: #255a38;
    --pad: #252a33;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); }
code, kbd { font-family: var(--font-code); font-size: .92em; }
kbd { border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 .3em; background: var(--surface); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page {
    display: grid;
    grid-template-columns: 18rem minmax(0, 1fr);
    gap: 2rem;
    max-width: 120rem;
    margin: 0 auto;
    padding-block: 1.25rem 4rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}

nav {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 1.25rem);
    align-self: start;
    max-height: calc(100vh - 2.5rem - env(safe-area-inset-top, 0px));
    display: flex;
    flex-direction: column;
    gap: .9rem;
}
h1 { margin: 0; font: 650 1.15rem/1.25 var(--font-ui); text-wrap: balance; }
h1 code { font-size: 1em; }
.about { margin: 0; color: var(--muted); font-size: .85rem; }
.controls { display: flex; flex-direction: column; gap: .5rem; }
#filter {
    width: 100%;
    font: inherit;
    padding: .4rem .6rem;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
}
.toggle { display: flex; align-items: center; gap: .4rem; font-size: .85rem; }
.legend { display: flex; flex-wrap: wrap; gap: .2rem .8rem; color: var(--muted); font-size: .8rem; }
.legend b { font: 400 1em var(--font-code); color: var(--ink); }
#shown { color: var(--muted); font-size: .8rem; letter-spacing: .03em; text-transform: uppercase; }

.contents { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: .6rem; padding-right: .25rem; }
.group { display: flex; flex-direction: column; }
.group .dir { font: .78rem/1.6 var(--font-code); color: var(--muted); }
.group a {
    display: flex;
    justify-content: space-between;
    gap: .5rem;
    padding: .05rem .5rem;
    border-left: 2px solid var(--rule);
    color: var(--ink);
    font: .82rem/1.55 var(--font-code);
    text-decoration: none;
}
.group a:hover { background: var(--surface); }
.group a[aria-current="true"] { border-left-color: var(--accent); color: var(--accent); background: var(--surface); }
.group a .same { color: var(--muted); font: .72rem/1.9 var(--font-ui); }

main { display: flex; flex-direction: column; gap: 2.25rem; min-width: 0; }
.test { display: flex; flex-direction: column; gap: .55rem; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 1rem); }
.test > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .8rem; }
h2 { margin: 0; font: 600 1rem/1.3 var(--font-code); overflow-wrap: anywhere; }
h2 a { color: inherit; text-decoration: none; }
h2 a:hover { text-decoration: underline; }
h2 .dir { color: var(--muted); font-weight: 400; }
.summary { color: var(--muted); font-size: .8rem; }

.options { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; }
.option { margin: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); max-width: 100%; }
.option figcaption { padding: .15rem .6rem; border-bottom: 1px solid var(--rule); color: var(--muted); font: .72rem/1.5 var(--font-code); }
.option pre { margin: 0; padding: .3rem .6rem; font: 12px/1.45 var(--font-code); white-space: pre-wrap; overflow-wrap: anywhere; }

.scroll { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
table.diff {
    --ws-colour: var(--whitespace);
    width: 100%;
    min-width: 40rem;
    border-collapse: collapse;
    table-layout: fixed;
    font: 13px/1.5 var(--font-code);
    tab-size: 4;
}
col.ln { width: 3rem; }
th {
    padding: .35rem .6rem;
    border-bottom: 1px solid var(--rule);
    text-align: left;
    color: var(--muted);
    font: 600 .72rem/1.4 var(--font-ui);
    letter-spacing: .05em;
    text-transform: uppercase;
}
th span { margin-left: .5rem; font-weight: 400; letter-spacing: 0; text-transform: none; }
th + th, td:nth-child(3) { border-left: 1px solid var(--rule); }
td { vertical-align: top; padding: 0 .6rem; }
td.ln { padding-right: .5rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; user-select: none; }
td.code { white-space: break-spaces; overflow-wrap: anywhere; }
td.none { padding: .4rem .6rem; color: var(--muted); font-family: var(--font-ui); }
td.old { background: var(--old); }
td.new { background: var(--new); }
td.pad { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--pad) 5px 6px); }
mark { --ws-colour: var(--muted); color: inherit; border-radius: 2px; }
td.old mark { background: var(--old-mark); }
td.new mark { background: var(--new-mark); }

/* Whitespace: a space is ·, a tab →, a newline ⏎. In a change they always show. */
i { font-style: normal; }
i.s, i.t { position: relative; }
i::before { color: var(--ws-colour); }
.ws i.s::before, mark i.s::before { content: "·"; position: absolute; left: 0; right: 0; text-align: center; }
.ws i.t::before, mark i.t::before { content: "→"; position: absolute; left: 0; }
.ws i.n::before, mark i.n::before { content: "⏎"; }
i.r::before { content: "␍"; color: var(--ink); }
i.u { border: 1px solid var(--whitespace); border-radius: 3px; padding: 0 2px; color: var(--muted); font-size: .75em; }

@media (max-width: 60rem) {
    .page { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
    nav { position: static; max-height: none; }
    .contents { max-height: 40vh; }
}
@media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
}
</style>

<div class="page">
    <nav>
        <h1><code>sc_format</code> golden tests</h1>
        <p class="about">
            Each input, formatted with the options above it, gives the expected file.
            Written by <code>test.py --html</code> from <code>tests/input</code> and <code>tests/expected</code>.
        </p>
        <div class="controls">
            <input id="filter" type="search" placeholder="Filter, e.g. chains on" aria-label="Filter tests by path">
            <label class="toggle"><input id="whitespace" type="checkbox" checked> Show spaces and tabs</label>
            <div class="legend">
                <span><b>·</b> space</span><span><b>→</b> tab</span><span><b>⏎</b> newline</span><span><b>␍</b> carriage return</span>
            </div>
            <div class="legend"><span><kbd>j</kbd> <kbd>k</kbd> next, previous</span><span><kbd>/</kbd> filter</span><span><kbd>w</kbd> whitespace</span></div>
        </div>
        <div id="shown"><!-- COUNT --> tests</div>
        <div class="contents">
<!-- CONTENTS -->
        </div>
    </nav>
    <main>
<!-- TESTS -->
    </main>
</div>

<script>
const sections = [...document.querySelectorAll("section.test")];
const links = new Map([...document.querySelectorAll(".contents a")].map(a => [a.dataset.test, a]));
const filter = document.getElementById("filter");
const whitespace = document.getElementById("whitespace");
const shown = document.getElementById("shown");

function visibleSections() {
    return sections.filter(s => !s.hidden);
}

// The section being read: the last one whose top is at or above the top of the window.
function current(list) {
    let index = -1;
    for (const [i, s] of list.entries()) {
        if (s.getBoundingClientRect().top > 24)
            break;
        index = i;
    }
    return index;
}

function markCurrent() {
    const list = visibleSections();
    const section = list[Math.max(0, current(list))];
    for (const [test, a] of links)
        a.setAttribute("aria-current", section && test === section.id ? "true" : "false");
}

function applyFilter() {
    const words = filter.value.toLowerCase().split(/\s+/).filter(Boolean);
    let count = 0;
    for (const s of sections) {
        const show = words.every(w => s.id.toLowerCase().includes(w));
        s.hidden = !show;
        links.get(s.id).hidden = !show;
        count += show ? 1 : 0;
    }
    for (const group of document.querySelectorAll(".contents .group"))
        group.hidden = !group.querySelector("a:not([hidden])");
    shown.textContent = count === sections.length ? `${count} tests` : `${count} of ${sections.length} tests`;
    markCurrent();
}

function go(step) {
    const list = visibleSections();
    if (list.length === 0)
        return;
    const next = list[Math.min(list.length - 1, Math.max(0, current(list) + step))];
    next.scrollIntoView({ block: "start" });
    history.replaceState(null, "", "#" + next.id);
}

function showWhitespace() {
    document.body.classList.toggle("ws", whitespace.checked);
}

filter.addEventListener("input", applyFilter);
whitespace.addEventListener("change", showWhitespace);
document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey)
        return;
    if (e.target === filter) {
        if (e.key === "Escape" || e.key === "Enter")
            filter.blur();
        return;
    }
    if (e.target instanceof HTMLInputElement)
        return;
    if (e.key === "j")
        go(1);
    else if (e.key === "k")
        go(-1);
    else if (e.key === "w") {
        whitespace.checked = !whitespace.checked;
        showWhitespace();
    } else if (e.key === "/") {
        e.preventDefault();
        filter.focus();
    }
});
let pending = false;
addEventListener("scroll", () => {
    if (pending)
        return;
    pending = true;
    requestAnimationFrame(() => {
        pending = false;
        markCurrent();
    });
}, { passive: true });

showWhitespace();
applyFilter();
</script>
