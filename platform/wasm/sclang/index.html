<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sc.wasm</title>
    <style>
        :root {
            --color-bg: #fff;
            --color-text: #333;
            --color-accent: #ff00ff;
        }

        * {
            box-sizing: border-box;
        }

        body, html, button, textarea, a, input {
            margin: 0;
            padding: 0;
            font-family: monospace;
            color: var(--color-text);
            background-color: var(--color-bg);
            line-height: 1.0;
            font-size: x-large;
        }

        .wrapper {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--color-accent);
        }

        h1, h2, h3, h4, h5, p {
            margin-block-start: 0;
            margin-block-end: 0;
        }

        .highlight {
            color: var(--color-accent);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;

            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
            }
        }

        input, textarea {
            width: 100%;
        }

        input.channel {
            width: auto;
        }

        .fullwidth {
            width: 100%;
            display: flex;
        }

        button {
            border-radius: 1px;
            border: 2px solid var(--color-accent);
            background-color: var(--color-bg);
            color: var(--color-accent);
            padding: 5px 10px;
        }

        input {
            outline: 0;
            border-width: 0 0 2px;
            /*border-color: var(--color-accent);*/
        }

        .input input {
            padding: 10px;
        }

        h2.section-header {
            margin: 30px 0;
        }
    </style>
</head>

<body>

<div class="wrapper">
    <div class="header">
        <h2 class="highlight">sclang.wasm</h2>
    </div>

    <div class="input">
        <h2 class="section-header">input</h2>
        <div style="color: gray">
            <p>Only single line statements are currently supported.</p>
            <p>Implicit printing is not activated yet - so use .postln or .postcs for printing.</p>
            <p>Press enter to evaluate the line. Using shift-enter will also clear the line.</p>
        </div>
        <div>
            <input id="user-input" style="width: 100%; margin-top: 1vh">
        </div>
    </div>

    <div>
        <h2 class="section-header">output</h2>
        <p>sclang console</p>
        <div class="fullwidth consoles" style="flex-direction: column; min-height: 50vh;">
            <textarea id="console" rows="8" readonly style="width: 100%; flex-grow: 4" wrap="off"></textarea>
        </div>
    </div>
</div>

<script async type="module" src="init.js"></script>

</body>
</html>
