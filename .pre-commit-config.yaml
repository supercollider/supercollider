repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-merge-conflict
    -   id: check-case-conflict

-   repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: '3.11.1'
    hooks:
    -   id: editorconfig-checker
        alias: ec
        name: Run editorconfig checker

-   repo: local
    hooks:
    -   id: clang_format
        name: Format C++ code
        entry: python tools/clang-format.py format
        pass_filenames: false
        types_or:
          - "c++"
        language: python
        additional_dependencies: ['clang-format==14.0.6']

    -   id: clang_lint
        name: Lint C++ code
        entry: python tools/clang-format.py lint
        pass_filenames: false
        types_or:
          - "c++"
        language: python
        additional_dependencies: ['clang-format==14.0.6']

    -   id: sc_format
        name: Format sclang code
        entry: python tools/sc_format.py
        pass_filenames: true
        files: '\.scd?$'
        exclude: '^langutils/'
        language: python

    -   id: sc_empty_blank_lines
        name:  Check trailing blank lines in sclang
        entry: python tools/remove_trailing_blank_lines.py
        pass_filenames: true
        # sc_format does it for other .sc and .scd files; examples/ has no sc_format options.
        files: '\.schelp$|^examples/.*\.scd?$'
        language: python
